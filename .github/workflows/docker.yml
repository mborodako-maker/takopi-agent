name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --frozen
      - run: just check
      - name: Validate deployment files
        env:
          IMAGE_REPOSITORY: ghcr.io/example/takopi-agent
          IMAGE_TAG: sha-validation
          TELEGRAM_BOT_TOKEN: placeholder
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          TELEGRAM_CHAT_ID: '123456789'
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f compose.dev.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.sandbox.yaml config --quiet
          bash -n scripts/update-vps.sh scripts/update.sh scripts/backup.sh scripts/install.sh

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/takopi-agent" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
